{% extends "base_auth.html" %}
{% block title %}Password updated — TravelDoor Connect{% endblock %}
{% block content %}
<div style="text-align:center;margin-bottom:20px;">
  <div style="width:46px;height:46px;margin:0 auto 12px;border-radius:14px;background:var(--teal-light);display:flex;align-items:center;justify-content:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 12.5 10 17.5 19 7" stroke="#2F7566" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h2 style="margin:0 0 4px;">Password updated</h2>
  <p class="muted" style="font-size:13px;margin:0;">Your new password is active — use it to sign in.</p>
</div>

<a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Go to sign in</a>
{% endblock %}
