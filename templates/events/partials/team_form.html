{# enctype + hx-encoding — this form carries an optional file (photo upload). #}
<form method="post" enctype="multipart/form-data"
      action="{% if member %}{% url 'events:team_edit' event.pk member.pk %}{% else %}{% url 'events:team_add' event.pk %}{% endif %}"
      hx-post="{% if member %}{% url 'events:team_edit' event.pk member.pk %}{% else %}{% url 'events:team_add' event.pk %}{% endif %}"
      hx-encoding="multipart/form-data"
      hx-target="#team-section" hx-swap="outerHTML" class="inline-form">
  {% csrf_token %}
  <h3 style="margin:0 0 14px;">{% if member %}Edit {{ member.name }}{% else %}New host{% endif %}</h3>
  {% include "partials/form_fields.html" with form=form %}
  <div id="photo-preview" style="display:none;margin:-6px 0 12px;">
    <img src="" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">
  </div>
  <div class="actions" style="margin-top:6px;">
    <button type="submit" class="btn btn-secondary">Save host</button>
    <button type="button" class="btn btn-ghost" onclick="this.closest('form').remove()">Cancel</button>
  </div>
</form>

<script>
  // Live preview of the picked photo, before anything is uploaded.
  (function () {
    var input = document.getElementById('id_photo');
    var box = document.getElementById('photo-preview');
    if (!input || !box) return;
    var img = box.querySelector('img');
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (file) { img.src = URL.createObjectURL(file); box.style.display = 'block'; }
      else { box.style.display = 'none'; }
    });
  })();
</script>
